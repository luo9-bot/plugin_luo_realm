[package]
name = "luo_realm"
version = "1.0.3"
edition = "2024"
description = "Luo Realm cultivation world plugin for luo9_bot"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
luo9_sdk = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
gif = "0.14"
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
thiserror = "2"
tiny_http = "0.12"
getrandom = "0.3"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
